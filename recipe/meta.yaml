{% set name = "deprecated" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 16850204d3a1e6bb0acd06bff48d96e8b0a0d25d1c52f71705405a0f4894192d

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<312]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.27
  run:
    - python
    - wrapt >=1.16,<3

test:
  source_files:
    - tests
  imports:
    - deprecated
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/laurent-laporte-pro/deprecated
  summary: Python @deprecated decorator to deprecate old python classes, functions or methods.
  license: MIT
  license_file: LICENSE.md
  license_family: MIT
  description: |
    If you need to mark a function or a method as deprecated, you can use the @deprecated decorator
  dev_url: https://github.com/laurent-laporte-pro/deprecated
  doc_url: https://app.readthedocs.org/projects/deprecated

extra:
  recipe-maintainers:
    - mariusvniekerk
