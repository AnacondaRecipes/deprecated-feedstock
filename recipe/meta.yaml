{% set name = "deprecated" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b1b50e0ff0c1fddaa5708a2c6b0a6588bb09b892825ab2b214ac9ea9d92a5223

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<27]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - wrapt >=1.10,<2
  run:
    - python
    - wrapt >=1.10,<2

test:
  source_files:
    - tests
  imports:
    - deprecated
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/laurent-laporte-pro/deprecated
  summary: Python @deprecated decorator to deprecate old python classes, functions or methods.
  license: MIT
  license_file: LICENSE.rst
  license_family: MIT
  description: |
    If you need to mark a function or a method as deprecated, you can use the @deprecated decorator
  dev_url: https://github.com/laurent-laporte-pro/deprecated
  doc_url: https://readthedocs.org/projects/deprecated

extra:
  recipe-maintainers:
    - mariusvniekerk
